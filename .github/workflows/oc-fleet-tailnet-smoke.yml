name: Fleet private Ollama connectivity (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-ollama:
    if: github.repository == 'MakerParsDev/oc-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify federated identity fields exist
        env:
          FLEET_TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          FLEET_TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ -z "$FLEET_TS_CLIENT_ID" ] || [ -z "$FLEET_TS_AUDIENCE" ]; then
            echo "::error::Missing Tailscale OIDC identity: configure TS_OAUTH_CLIENT_ID and TS_AUDIENCE for MakerParsDev/oc-test first."
            exit 1
          fi
      - name: Join tailnet using GitHub federated identity
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Verify private model inventory without inference
        env:
          FLEET_MODEL_API: https://amd2700x-ubuntu.morray-fort.ts.net:8443
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$FLEET_MODEL_API/api/version" >/dev/null
          curl --fail --silent --show-error --max-time 15 "$FLEET_MODEL_API/api/tags" |
            python3 -c 'import json,sys;d=json.load(sys.stdin);assert any(x.get("name")=="qwen3:4b-instruct" for x in d.get("models",[])), "Qwen3 private model missing"'
          echo "Private Ollama connection healthy. No model request, task, PR, or merge was started."
